name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mytime
          POSTGRES_PASSWORD: mytime
          POSTGRES_DB: mytime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mytime" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mytime:mytime@localhost:5432/mytime_test
      E2E_DATABASE_URL: postgres://mytime:mytime@localhost:5432/mytime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t mytime:ci .
