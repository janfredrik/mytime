# MyTime i produksjon. TLS termineres i eksisterende reverse proxy (NPM/SWAG/Traefik/Cloudflare Tunnel),
# som videresender https://mytime.x99.no til APP_PORT på Docker-verten.
services:
  app:
    # Ferdig image fra GitHub Actions. `docker compose up -d --build` bygger lokalt i stedet.
    image: ghcr.io/janfredrik/mytime:${MYTIME_TAG:-latest}
    build: .
    container_name: mytime
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mytime:${POSTGRES_PASSWORD:?Sett POSTGRES_PASSWORD i .env}@db:5432/mytime
    ports:
      - '${APP_PORT:-3135}:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: mytime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mytime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett POSTGRES_PASSWORD i .env}
      POSTGRES_DB: mytime
      TZ: Europe/Oslo
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mytime -d mytime']
      interval: 10s
      timeout: 5s
      retries: 10
